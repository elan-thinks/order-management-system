spring.application.name=ordermanagement

#spring.datasource.url=jdbc:mysql://localhost:3306/order_mgmt_db
# 1. Database Connection (Double check your password!)
spring.datasource.url=jdbc:mysql://localhost:3306/order_mgmt_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 2. Hibernate Strategy (This creates the table)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver