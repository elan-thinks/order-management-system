<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seller Portal | Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex">

<aside class="w-64 min-h-screen bg-white border-r border-gray-200 p-6 flex flex-col sticky top-0">
    <div class="flex items-center gap-2 mb-10 text-blue-600 font-bold text-xl">
        <i class="fas fa-store"></i> <span>Seller Portal</span>
    </div>

    <nav class="space-y-4 flex-1">
        <a href="/" class="flex items-center gap-3 p-3 rounded-lg text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="/products" class="flex items-center gap-3 p-3 rounded-lg bg-blue-50 text-blue-600 font-medium">
            <i class="fas fa-box"></i> Products
        </a>
        <a href="/orders" class="flex items-center gap-3 p-3 rounded-lg text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition">
            <i class="fas fa-shopping-cart"></i> Orders
        </a>
    </nav>
</aside>

<main class="flex-1">
    <header class="h-16 bg-white border-b border-gray-200 px-8 flex items-center justify-between">
        <div class="relative w-1/2">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            <input type="text" class="w-full pl-10 pr-4 py-2 bg-gray-100 rounded-lg focus:outline-none" placeholder="Search products...">
        </div>
        <div class="flex items-center gap-4">
            <i class="far fa-bell text-gray-500 text-xl cursor-pointer"></i>
            <div class="w-8 h-8 bg-blue-600 rounded-full text-white flex items-center justify-center font-bold">EA</div>
        </div>
    </header>

    <section class="p-8">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Product Management</h1>
                <p class="text-gray-500">Manage your product inventory and listings</p>
            </div>
            <button onclick="toggleModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium flex items-center gap-2 hover:bg-blue-700">
                <i class="fas fa-plus"></i> Add New Product
            </button>
        </div>

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold border-b border-gray-200">
                <tr>
                    <th class="px-6 py-4">Product Name</th>
                    <th class="px-6 py-4">SKU</th>
                    <th class="px-6 py-4">Inventory</th>
                    <th class="px-6 py-4">Price</th>
                    <th class="px-6 py-4 text-end">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="product : ${products}" class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 font-medium text-gray-800" th:text="${product.name}">Product Name</td>
                    <td class="px-6 py-4 text-gray-500" th:text="${product.sku}">SKU-001</td>
                    <td class="px-6 py-4">
                        <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold"
                         th:text="${product.stockQuantity} + ' In Stock'">45 In Stock</span>
                    </td>
                    <td class="px-6 py-4 font-semibold text-gray-800"
                        th:text="'$' + ${product.price.amount}">$0.00</td>
                    <td class="px-6 py-4 text-end">
                        <form th:action="@{/orders}" method="post" class="flex items-center justify-end gap-2">
                            <input type="hidden" name="product" th:value="${product.name}">
                            <input type="hidden" name="quantity" value="1">
                            <input type="hidden" name="price" th:value="${product.price.amount}">

                            <button type="submit" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-700 transition">
                                <i class="fas fa-shopping-cart mr-1"></i> Create Order
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>


<div id="productModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
        <h2 class="text-xl font-bold mb-4">Add New Product</h2>
        <form th:action="@{/products}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Product Name</label>
                <input type="text" name="name" required class="w-full border rounded-lg p-2 mt-1">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">SKU</label>
                    <input type="text" name="sku" required class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    <input type="text" name="category" required class="w-full border rounded-lg p-2 mt-1">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Price ($)</label>
                    <input type="number" step="0.01" name="price" required class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Initial Stock</label>
                    <input type="number" name="inventory" required class="w-full border rounded-lg p-2 mt-1">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="toggleModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Product</button>
            </div>
        </form>
    </div>
</div>
</main>
<script>
    function toggleModal() {
        const modal = document.getElementById('productModal');
        modal.classList.toggle('hidden');
    }
</script>

</body>
</html>
