<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prodlytics | Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; }
        .container { max-width: 1200px; }

        /* Professional Search Bar */
        .search-bar {
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            padding: 14px 28px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            font-size: 1rem;
        }

        /* KPI Cards */
        .kpi-card {
            border: none;
            border-radius: 16px;
            background: white;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }
        .kpi-card:hover { transform: translateY(-2px); }

        /* Status Badges */
        .status-pill {
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .bg-delivered { background: #dcfce7; color: #166534; }
        .bg-pending { background: #fef9c3; color: #854d0e; }
        .bg-shipped { background: #e0f2fe; color: #0369a1; }

        /* Table Styling */
        .table-card { border-radius: 16px; border: none; background: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .table thead th { background: #f1f5f9; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; color: #64748b; border: none; }
        .table tbody td { border-bottom: 1px solid #f1f5f9; padding: 16px 8px; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <div class="row mb-5 justify-content-center">
        <div class="col-md-8">
            <input type="text" id="mainSearch" class="form-control search-bar" placeholder="🔍 Search by product name or Order ID...">
        </div>
    </div>

    <div class="row mb-4 g-3">
        <div class="col-md-3">
            <div class="card kpi-card p-4">
                <small class="text-uppercase fw-bold text-muted">Total Orders</small>
                <h2 class="fw-bold mb-0" th:text="${stats.totalOrders}">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card kpi-card p-4 border-start border-primary border-4">
                <small class="text-uppercase fw-bold text-muted">Total Revenue</small>
                <h2 class="fw-bold text-primary mb-0" th:text="'$' + ${stats.totalRevenue}">$0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card kpi-card p-4">
                <small class="text-uppercase fw-bold text-muted">Items Sold</small>
                <h2 class="fw-bold mb-0" th:text="${stats.totalItemsSold}">0</h2>
            </div>
        </div>
<!--        <div class="col-md-3 align-self-center text-end">-->
<!--            <a href="/api/reports/download" class="btn btn-dark rounded-pill px-4 shadow-sm">-->
<!--                📥 Download Report-->
<!--            </a>-->
<!--        </div>-->
    </div>

    <div class="card p-4 mb-4 border-0 shadow-sm" style="border-radius: 16px;">
        <h6 class="fw-bold mb-3 text-muted text-uppercase">Quick Add Order</h6>
        <form th:action="@{/web/orders}" method="post" class="row g-3">
            <div class="col-md-4">
                <input type="text" name="product" class="form-control" placeholder="Product Name" required>
            </div>
            <div class="col-md-2">
                <input type="number" name="quantity" class="form-control" placeholder="Qty" required>
            </div>
            <div class="col-md-3">
                <input type="number" step="0.01" name="price" class="form-control" placeholder="Unit Price" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">Add Order</button>
            </div>
        </form>
    </div>

    <div class="card table-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="btn-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <button class="btn btn-white border filter-btn active" data-status="all">All Orders</button>
                <button class="btn btn-white border filter-btn" data-status="Pending">Pending</button>
                <button class="btn btn-white border filter-btn" data-status="Delivered">Completed</button>
            </div>
            <span class="text-muted small" th:text="${orders.size() + ' orders found'}"></span>
        </div>

        <table class="table align-middle" id="orderTable">
            <thead>
            <tr>
                <th class="ps-3">Order ID</th>
                <th>Product</th>
                <th>Price</th>
                <th>Amount</th>
                <th>Payment</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td class="ps-3 fw-bold" th:text="${order.orderId}"></td>
                <td th:text="${order.productName}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(order.unitPrice, 1, 2)}"></td>
                <td th:text="${order.qty}"></td>
                <td th:text="${order.payment}"
                    th:classappend="${order.payment == 'Paid' ? 'text-success fw-bold' : 'text-danger'}">
                </td>
                <td>
                    <span th:class="'status-pill bg-' + ${#strings.toLowerCase(order.orderStatus)}" th:text="${order.orderStatus}"></span>
                </td>
                <td class="text-end">
                    <div class="btn-group">
                        <form th:action="@{/api/orders/update-status}" method="post" style="display:inline;">
                            <input type="hidden" name="orderId" th:value="${order.orderId}">
                            <input type="hidden" name="newStatus" value="Delivered">
                            <button type="submit" class="btn btn-sm btn-outline-success me-2 rounded-pill">Done</button>
                        </form>
                        <button type="button"
                                class="btn btn-sm btn-outline-danger rounded-pill"
                                th:data-id="${order.orderId}"
                                onclick="deleteOrder(this.getAttribute('data-id'))">
                            Delete
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // COMBINED Search and Filter Logic
    const searchInput = document.getElementById('mainSearch');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let currentStatus = 'all';

    function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase();
        const rows = document.querySelectorAll('#orderTable tbody tr');

        rows.forEach(row => {
            const productName = row.cells[1].textContent.toLowerCase();
            const orderId = row.cells[0].textContent.toLowerCase();
            const status = row.cells[5].textContent.trim();

            const matchesSearch = productName.includes(searchTerm) || orderId.includes(searchTerm);
            const matchesStatus = currentStatus === 'all' || status === currentStatus;

            row.style.display = (matchesSearch && matchesStatus) ? '' : 'none';
        });
    }

    searchInput.addEventListener('input', applyFilters);

    filterButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            filterButtons.forEach(b => b.classList.remove('btn-primary', 'text-white'));
            this.classList.add('btn-primary', 'text-white');
            currentStatus = this.getAttribute('data-status');
            applyFilters();
        });
    });

    function deleteOrder(orderId) {
        console.log("Attempting to delete order:", orderId); // Debugging line

        if (confirm("Are you sure you want to delete order: " + orderId + "?")) {
            fetch('/api/orders/' + orderId, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        window.location.reload(); // Refresh to show it's gone
                    } else {
                        alert("Delete failed! Check the console.");
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    }
    // Delete Confirmation
    function confirmDelete(id) {
        if (confirm('Permanently delete order ' + id + '?')) {
            fetch('/api/orders/' + id, { method: 'DELETE' })
                .then(res => { if(res.ok) window.location.reload(); });
        }
    }
</script>
</body>
</html>
