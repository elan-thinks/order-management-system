<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prodlytics | Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; }
        .container { max-width: 1200px; }

        /* Professional Search Bar */
        .search-bar {
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            padding: 14px 28px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            font-size: 1rem;
        }

        /* KPI Cards */
        .kpi-card {
            border: none;
            border-radius: 16px;
            background: white;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }
        .kpi-card:hover { transform: translateY(-2px); }

        /* Status Badges */
        .status-pill {
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        /* Ensure these match the lowercase version of your statuses */
        .bg-delivered { background: #dcfce7; color: #166534; }
        .bg-pending { background: #fef9c3; color: #854d0e; }
        .bg-unpaid { background: #fee2e2; color: #991b1b; } /* Added for 'Unpaid' orders */

        /* Table Styling */
        .table-card { border-radius: 16px; border: none; background: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .table thead th { background: #f1f5f9; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; color: #64748b; border: none; }
        .table tbody td { border-bottom: 1px solid #f1f5f9; padding: 16px 8px; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <div class="row mb-5 justify-content-center">
        <div class="col-md-8">
            <input type="text" id="mainSearch" class="form-control search-bar" placeholder="🔍 Search by product name or Order ID...">
        </div>
    </div>

    <div class="row mb-4 g-3">
        <div class="col-md-3">
            <div class="card kpi-card p-4">
                <small class="text-uppercase fw-bold text-muted">Total Orders</small>
                <h2 class="fw-bold mb-0" th:text="${stats.totalOrders}">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card kpi-card p-4 border-start border-primary border-4">
                <small class="text-uppercase fw-bold text-muted">Total Revenue</small>
                <h2 class="fw-bold text-primary mb-0" th:text="'$' + ${#numbers.formatDecimal(stats.revenue, 1, 2)}">$0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card kpi-card p-4">
                <small class="text-uppercase fw-bold text-muted">Items Sold</small>
                <h2 class="fw-bold mb-0" th:text="${stats.totalItems}">0</h2>
            </div>
        </div>
    </div>

    <div class="card p-4 mb-4 border-0 shadow-sm" style="border-radius: 16px;">
        <h6 class="fw-bold mb-3 text-muted text-uppercase">Quick Add Order</h6>
        <form action="/orders" method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="product" class="form-control" placeholder="Product Name" required>
                </div>
                <div class="col-md-2">
                    <input type="number" name="quantity" class="form-control" placeholder="Qty" required>
                </div>
                <div class="col-md-3">
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="Price" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Add Order</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card table-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="btn-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <button class="btn btn-white border filter-btn active" data-status="all">All Orders</button>
                <button class="btn btn-white border filter-btn" data-status="PENDING">Pending</button>
                <button class="btn btn-white border filter-btn" data-status="DELIVERED">Completed</button>
            </div>
            <span class="text-muted small" th:text="${orders.size() + ' orders found'}"></span>
        </div>

        <table class="table align-middle" id="orderTable">
            <thead>
            <tr>
                <th class="ps-3">Date</th>
                <th>Order ID</th>
                <th>Product</th>
                <th>Unit Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>

                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
        <tr th:each="order : ${orders}">
            <td class="ps-3 text-muted small" th:text="${order.orderDate}"></td>

            <td class="ps-3 fw-bold" th:text="${order.orderId}"></td>

            <td th:text="${order.productName}"></td>

            <td th:text="'$' + ${#numbers.formatDecimal(order.unitPrice, 1, 2)}"></td>

            <td th:text="${order.qty}"></td>

            <td th:text="'$' + ${#numbers.formatDecimal(order.totalPrice, 1, 2)}"></td>
            <td th:text="${order.payment}"
                th:classappend="${#strings.equalsIgnoreCase(order.payment, 'Paid') ? 'text-success fw-bold' : 'text-danger'}">
            </td>

            <td>
            <span class="status-pill"
                  th:classappend="'bg-' + ${#strings.toLowerCase(order.orderStatus)}"
                  th:text="${order.orderStatus}">
            </span>
            </td>




            <td class="text-end">
                <div class="d-flex justify-content-end">
                    <form th:action="@{/orders/{id}/done(id=${order.orderId})}" method="POST" class="me-2">
                        <button type="submit" class="btn btn-sm btn-outline-success rounded-pill">DONE</button>
                    </form>
                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill"
                            th:attr="data-order-id=${order.orderId}" onclick="handleDelete(this)">
                        Delete
                    </button>
                </div>
            </td>
        </tr>
        </tbody>
        </table>
    </div>
</div>
<script th:inline="javascript">
    const searchInput = document.getElementById('mainSearch');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let currentStatus = 'all';

    function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase();
        const rows = document.querySelectorAll('#orderTable tbody tr');

        rows.forEach(row => {
            // Text search across the whole row
            const rowText = row.innerText.toLowerCase();

            // Specifically find the Status text inside our pill
            const statusElement = row.querySelector('.status-pill');
            const statusValue = statusElement ? statusElement.innerText.trim().toUpperCase() : "";

            const matchesSearch = rowText.includes(searchTerm);

            let matchesStatus = false;
            if (currentStatus === 'ALL') {
                matchesStatus = true;
            } else {
                // This matches "PENDING" or "DELIVERED"
                matchesStatus = (statusValue === currentStatus);
            }

            row.style.display = (matchesSearch && matchesStatus) ? "" : "none";
        });
    }

    // Events
    searchInput.addEventListener('input', applyFilters);

    filterButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            filterButtons.forEach(b => b.classList.remove('btn-primary', 'text-white'));
            this.classList.add('btn-primary', 'text-white');

            // Set currentStatus to PENDING or DELIVERED (Uppercase)
            currentStatus = this.getAttribute('data-status').toUpperCase();
            applyFilters();
        });
    });

    function handleDelete(buttonElement) {
        const id = buttonElement.getAttribute('data-order-id');
        if (confirm("Delete order " + id + "?")) {
            fetch('/orders/' + id + '/delete', { method: 'POST' })
                .then(res => { if(res.ok) window.location.reload(); });
        }
    }
</script>
</body>
</html>
